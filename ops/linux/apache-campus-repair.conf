# Campus Repair — Apache vhost (Ubuntu, mod_php)
#
# วางที่: /etc/apache2/sites-available/campus-repair.conf
# แล้วแก้ <DOMAIN> เป็นโดเมนจริง เช่น repair.school.ac.th
#
#   sudo a2ensite campus-repair
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# เว็บอยู่ใต้ path /campus-repair/ โดยให้ DocumentRoot เป็น /var/www
# (แอปอยู่ใน /var/www/campus-repair) และ .htaccess ของแอปจัดการ SPA/บล็อกไฟล์เอง

<VirtualHost *:80>
    ServerName <DOMAIN>

    # ให้ ACME/health check ผ่านได้ ส่วนที่เหลือบังคับ HTTPS
    Redirect permanent / https://<DOMAIN>/

    ErrorLog ${APACHE_LOG_DIR}/campus-repair-error.log
    CustomLog ${APACHE_LOG_DIR}/campus-repair-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName <DOMAIN>
    DocumentRoot /var/www

    <Directory /var/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/<DOMAIN>/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/<DOMAIN>/privkey.pem

    # ความปลอดภัยพื้นฐาน
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # อัปโหลดรูป: อย่าให้ Apache ตีความเป็นสคริปต์ ( defence in depth เสริม .htaccess )
    <Directory /var/www/campus-repair/api/uploads>
        AllowOverride All
        Options -Indexes
        <FilesMatch "\.(php|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/campus-repair-error.log
    CustomLog ${APACHE_LOG_DIR}/campus-repair-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# ทางเลือก: staging ก่อนมี certificate
# ใช้บล็อกนี้แทน (ชั่วคราว) แล้วค่อยสลับไป HTTPS เมื่อออก cert สำเร็จ
